# Alembic. Запуск из папки src/:
#   cd src && alembic upgrade head
#   cd src && alembic revision --autogenerate -m "описание"
# URL базы берётся из DATABASE_URL через Settings (см. db/migrations/env.py).
# На проде миграции применяет сам бот/воркер при старте (db/session.py::init_db).

[alembic]
script_location = db/migrations
file_template = %%(rev)s_%%(slug)s
