# ВНИМАНИЕ (D-062): Config as Code Railway отключает — этот файл работает у воркера до
# 01.12.2026. Уже сейчас задайте воркеру переменную SERVICE_ROLE=worker (src/start.py —
# CMD образа): после отключения файла воркер запустится по ней, а не как бот.
#
# Конфиг сервиса worker в Railway (ARQ-воркер генерации).
#
# Бот использует railway.toml (команда запуска — CMD из Dockerfile).
# Воркер собирается из того же образа, но запускается другой командой.
# Чтобы Railway взял команду отсюда, а не из интерфейса: сервис worker →
# Settings → Config-as-code → путь к файлу: /railway.worker.toml.
#
# startCommand намеренно НЕ добавлен в railway.toml: config-as-code имеет
# приоритет над интерфейсом, и воркер, читающий railway.toml по умолчанию,
# запустил бы бота.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c \"cd src && arq worker.WorkerSettings\""
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
