# Реальные генерации golden-корпуса (ТЗ 4.8.7, 7.4): G-01 docx strict ×2,
# G-02 pdf strict ×2, G-03 по теме ×1, питч-дек по теме ×1. Каждая колода
# проверяется check_case.py; итог — комментарий в PR, JSON и PDF — артефакт.
# Новый движок (src/core, сессия 1): пробный вызов structured outputs и колоды
# по теме G-05 и «Как работает фотосинтез» — tests/golden/run_new_engine.py.
# С сессии 2 golden целиком переходит на новый движок (docs/design/07_TESTING.md, 3).
#
# Запуск: автоматически на PR, меняющие промпты или код генерации, и вручную
# (Actions → golden → Run workflow). Нужен секрет OPENAI_API_KEY; без него
# workflow пропускается с сообщением, а не падает.
name: golden

on:
  pull_request:
    paths:
      - "prompts/**"
      - "src/generation/**"
      - "src/core/**"
      - "layouts/**"
      - "themes/**"
      - "tests/golden/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

# Не больше одного запуска на PR (или ветку) одновременно: новый пуш отменяет старый
concurrency:
  group: golden-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-secret:
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            msg="Секрет OPENAI_API_KEY не задан (или PR из форка) — golden пропущен. Settings → Secrets and variables → Actions → New repository secret."
            echo "::notice::$msg"
            echo "## Golden пропущен" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

  golden:
    needs: check-secret
    if: needs.check-secret.outputs.has_key == 'true'
    # jammy, как образ прода (playwright/python:v1.44.0-jammy): на 24.04
    # `playwright install --with-deps` 1.44 падает на пакете libasound2
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Дефолты — как в проде; переопределяются переменными репозитория
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.proxyapi.ru/openai/v1' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-luna' }}
      OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'low' }}
      OPENAI_TIMEOUT_SECONDS: ${{ vars.OPENAI_TIMEOUT_SECONDS || '45' }}
      TELEGRAM_BOT_TOKEN: "123456:ci-dummy"   # Settings требует; Telegram не используется
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: Chromium для PDF
        run: python -m playwright install --with-deps chromium

      - name: LibreOffice и шрифты для нового движка
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-impress \
            fonts-liberation fonts-crosextra-carlito fonts-dejavu-core fonts-noto-core

      - name: Генерации и check_case
        run: |
          set +e
          python tests/golden/run_golden.py --out golden_out
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error::API $OPENAI_BASE_URL недоступен с раннера GitHub — см. сводку."
            cat >> golden_out/summary.md <<'EOF'

          **Что можно сделать:**
          1. Переменная репозитория `OPENAI_BASE_URL=https://api.openai.com/v1` и в секрет — ключ OpenAI напрямую (цены в `prompts/models.yaml` — в ₽ ProxyAPI, стоимость будет оценочной).
          2. Self-hosted runner в РФ (любой VPS): `runs-on: self-hosted` в `.github/workflows/golden.yml`.
          3. Запускать `tests/golden/run_golden.py` вручную на машине, откуда API доступен, и прикладывать `summary.md` к PR.
          EOF
          fi
          exit "$code"

      - name: Новый движок — structured outputs и колоды по теме
        if: always() && hashFiles('golden_out/summary.md') != ''
        run: |
          set +e
          python tests/golden/run_new_engine.py --out golden_out/new_engine
          code=$?
          set -e
          if [ -f golden_out/new_engine/new_engine.md ]; then
            printf '\n' >> golden_out/summary.md
            cat golden_out/new_engine/new_engine.md >> golden_out/summary.md
          fi
          exit "$code"

      - name: Сводка в Summary
        if: always() && hashFiles('golden_out/summary.md') != ''
        run: cat golden_out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Артефакт с колодами
        if: always() && hashFiles('golden_out/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: golden-decks
          path: golden_out/
          retention-days: 30

      - name: Комментарий в PR
        if: always() && hashFiles('golden_out/summary.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            let number = context.payload.pull_request?.number;
            if (!number) {
              // ручной запуск: ищем открытый PR этой ветки
              const branch = context.ref.replace('refs/heads/', '');
              const prs = await github.rest.pulls.list({ owner, repo, head: `${owner}:${branch}`, state: 'open' });
              number = prs.data[0]?.number;
            }
            if (!number) { core.info('PR для этой ветки не найден — сводка только в Summary'); return; }
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = fs.readFileSync('golden_out/summary.md', 'utf8') +
              `\n\n[Запуск и артефакт golden-decks](${runUrl})`;
            const marker = '<!-- golden-report -->';
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number });
            const old = comments.find(c => c.body && c.body.includes(marker));
            if (old) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }
