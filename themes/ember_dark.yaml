# Тема оформления (docs/design/05_LAYOUTS.md, 6; контракт — 04_CONTRACTS.md, 6.2).
# Тёмная тёплая (в духе шаблона «Премиум», docs/design/references/): почти чёрный фон, белые
# заголовки и текст; тёплый акцент — оранжевый → янтарный, текстом только в цифрах, номерах и мелких
# подписях. Градиент — панелями, полосами и фигурами; целиком цветные только титул и финал, пауза —
# тёмный слайд с градиентной панелью. Декор — дуги и кольца (сессия 4, D-063; правка владельца — D-070).
id: ember_dark
name: {ru: "Тёмная тёплая", en: "Ember dark"}
mode: dark
tags: [business, tech, bold]
free: true
enabled: true
replaces: [graphite_dark]
fonts: {heading: Arial, body: Arial}
colors:
  bg: "#0F0F11"
  surface: "#19191C"
  surface_alt: "#232327"
  primary: "#FFA23A"           # цифры, номера, мелкие подписи — не заголовки
  on_primary: "#121214"
  brand: "#E8650F"             # градиент тёмно-оранжевый → янтарный
  brand_2: "#FFB23E"
  on_brand: "#121214"
  accent: "#FFC25C"
  on_accent: "#121214"
  paper: "#FFFFFF"
  on_paper: "#1C1A20"
  text: "#F5F3F0"
  text_muted: "#B7B7B7"
  border: "#2D2D31"
  on_status: "#0F0F11"         # текст и иконки на шапках positive / negative
  positive: "#6FCF97"
  negative: "#F28B82"
# Серии и сектора: янтарный акцент первым, дальше — холодные и зелёный тона без красного и розового,
# чтобы не спорить с акцентом; ≥ 3:1 к фону, первые пять различимы (CIEDE2000 ≥ 20).
chart: ["#FFA23A", "#4FA3F7", "#22C3D8", "#B48CFF", "#9BD66B", "#9CA3AF"]
typescale: {hero: 96, display: 60, h1: 36, h2: 26, h3: 20, body: 18, small: 14, min: 12}
style:
  radius: 16
  image_radius: 16
  gradient_angle: 30
  card: fill
  card_stripe: top
  stripe_fill: $brand          # полоса карточки — градиент темы
  header: underline
  heading_color: text          # заголовки пунктов — светлые (акцент текстом только в цифрах)
  badge: circle
  quote_plate: surface       # плашка цитаты statement.big_quote
  quote_text: text
  icon_plate: gradient
  full_color: cover            # целиком цветные — только титул и финал; пауза — градиентная панель
decor:
  cover:
    - {shape: arc, center: [w-180, h-60], radius: 520, thickness: 3, start: 0, end: 360, fill: on_brand, alpha: 0.22}
    - {shape: arc, center: [w-180, h-60], radius: 380, thickness: 40, start: 180, end: 300, fill: on_brand, alpha: 0.10}
    - {shape: arc, center: [w-180, h-60], radius: 250, thickness: 3, start: 0, end: 360, fill: on_brand, alpha: 0.22}
    - {shape: circle, center: [210, 130], radius: 46, fill: on_brand}
    - {shape: arc, center: [210, 130], radius: 92, thickness: 3, start: 0, end: 360, fill: on_brand, alpha: 0.3}
  band:
    - {shape: arc, center: [w-160, h], radius: 260, thickness: 3, start: 0, end: 360, fill: on_brand, alpha: 0.25}
    - {shape: arc, center: [w-160, h], radius: 170, thickness: 28, start: 180, end: 300, fill: on_brand, alpha: 0.18}
  pause:
    - {shape: arc, center: [w-60, -40], radius: 300, thickness: 3, start: 0, end: 360, fill: primary, alpha: 0.5}
    - {shape: arc, center: [w-60, -40], radius: 220, thickness: 18, start: 90, end: 180, fill: {gradient: [brand, brand_2]}}
  header: []
  content:
    - {shape: arc, center: [w, 0], radius: 160, thickness: 22, start: 90, end: 180,
       fill: {gradient: [brand, brand_2]}}
    - {shape: arc, center: [w, 0], radius: 124, thickness: 3, start: 90, end: 180, fill: primary, alpha: 0.6}
    - {shape: circle, center: [w-40, 200], radius: 10, fill: primary}
    - {shape: polygon, points: [[0, h-10], [w, h-10], [w, h], [0, h]], fill: {gradient: [brand, brand_2], angle: 0}}
# Пороги доли цвета в стресс-галерее: заголовки и текст светлые, акцент — в цифрах, номерах,
# иконках и полосах (D-070); титул, финал и диаграммы — общие пороги.
gallery: {content_min: 2.5}
contrast_pairs:
  - [text, bg]
  - [text, surface]
  - [text, surface_alt]
  - [text_muted, bg]
  - [text_muted, surface]
  - [primary, bg]
  - [primary, surface]
  - [on_primary, primary]
  - [on_brand, brand]
  - [on_brand, brand_2]
  - [on_accent, accent]
  - [on_paper, paper]
  - [positive, surface]
  - [negative, surface]
  - [on_status, positive]
  - [on_status, negative]
