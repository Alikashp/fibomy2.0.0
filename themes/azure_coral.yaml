# Тема оформления (docs/design/05_LAYOUTS.md, 6; контракт — 04_CONTRACTS.md, 6.2).
# Яркая: синяя с коралловым акцентом. Выбор в сводке бота — с сессии 2.
id: azure_coral
name: {ru: "Лазурь", en: "Azure"}
mode: light
tags: [bright, education, business]
free: true                  # фаза 1: все темы всем (вопрос 12)
enabled: true               # доступна в боте (с сессии 2)
fonts: {heading: Arial, body: Arial}
colors:
  bg: "#FFFFFF"
  surface: "#EEF4FF"
  surface_alt: "#DCE8FE"
  primary: "#1A56DB"
  accent: "#C93A3F"
  text: "#111827"
  text_muted: "#475467"
  on_primary: "#FFFFFF"
  border: "#C7D7F5"
  positive: "#13733A"
  negative: "#B42318"
# Серии и сектора диаграмм по порядку: графика ≥ 3:1 к bg и surface, первые пять
# попарно различимы (CIEDE2000 ≥ 20), шестой — нейтральный для «прочее».
chart: ["#1A56DB", "#E0453F", "#0B8A9A", "#B87100", "#9C2FB0", "#5B6475"]
typescale: {hero: 96, display: 60, h1: 36, h2: 26, h3: 20, body: 18, small: 14, min: 12}
style:
  radius: 8                 # 0 / 8 / 16
  card: fill                # fill / outline
  image: plain              # plain / rounded
  decor: line               # none / line
# Пары «текст / фон», которые реально встречаются в макетах; тест — не ниже 4.5:1
contrast_pairs:
  - [text, bg]
  - [text, surface]
  - [text, surface_alt]
  - [text_muted, bg]
  - [text_muted, surface]
  - [primary, bg]
  - [primary, surface]
  - [accent, bg]
  - [accent, surface]
  - [positive, surface]
  - [negative, surface]
  - [on_primary, primary]
