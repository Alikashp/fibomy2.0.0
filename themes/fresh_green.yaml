# Тема оформления (docs/design/05_LAYOUTS.md, 6; контракт — 04_CONTRACTS.md, 6.2).
# Яркая: свежая зелёная с янтарным акцентом. Выбор в сводке бота — сессия 3.
id: fresh_green
name: {ru: "Свежая зелёная", en: "Fresh green"}
mode: light
tags: [bright, education, eco]
free: true                  # фаза 1: все темы всем (вопрос 12)
enabled: false               # доступна в боте
fonts: {heading: Arial, body: Arial}
colors:
  bg: "#FFFFFF"
  surface: "#EEF7F1"
  surface_alt: "#DDEFE3"
  primary: "#11713F"
  accent: "#B54708"
  text: "#14201A"
  text_muted: "#46564D"
  on_primary: "#FFFFFF"
  border: "#C5DFCD"
  positive: "#11713F"
  negative: "#B42318"
# Серии и сектора диаграмм по порядку: графика ≥ 3:1 к bg и surface, первые пять
# попарно различимы (CIEDE2000 ≥ 20), шестой — нейтральный для «прочее».
chart: ["#16884A", "#2F6FD6", "#C9620A", "#C93A6E", "#8340C8", "#66706B"]
typescale: {hero: 96, display: 60, h1: 36, h2: 26, h3: 20, body: 18, small: 14, min: 12}
style:
  radius: 8                 # 0 / 8 / 16
  card: fill                # fill / outline
  image: plain              # plain / rounded
  decor: line               # none / line
# Пары «текст / фон», которые реально встречаются в макетах; тест — не ниже 4.5:1
contrast_pairs:
  - [text, bg]
  - [text, surface]
  - [text, surface_alt]
  - [text_muted, bg]
  - [text_muted, surface]
  - [primary, bg]
  - [primary, surface]
  - [accent, bg]
  - [accent, surface]
  - [positive, surface]
  - [negative, surface]
  - [on_primary, primary]
