# Тема оформления (docs/design/05_LAYOUTS.md, 6; контракт — 04_CONTRACTS.md, 6.2).
# Светлая деловая (ориентир — шаблон Focus, docs/design/references/): плоский современный стиль —
# белый фон, светлые карточки без градиентов, тёмно-синий текст и один яркий акцент — насыщенный
# синий; заголовок — тёмный текст с тонкой акцентной линией; титул и финал — плоская синяя заливка
# с крупными плоскими кругами. Спокойная тема для корпоративного сегмента. По умолчанию.
# (Сессия 4, D-063; переделка по замечанию владельца «как PowerPoint 2010» — D-070.)
id: business_slate
name: {ru: "Деловая серо-синяя", en: "Business slate"}
mode: light
tags: [business, academic]
free: true                  # фаза 1: все темы всем (вопрос 12)
enabled: true
replaces: [graphite_light]  # старые id, которые переводятся на эту тему (бот, API, DeckSpec)
fonts: {heading: Arial, body: Arial}
colors:
  bg: "#FFFFFF"
  surface: "#F3F5F8"
  surface_alt: "#E8ECF2"
  primary: "#2563EB"         # единственный яркий акцент: номера, числа, заголовки пунктов, линии
  on_primary: "#FFFFFF"
  brand: "#1D4ED8"           # плоская заливка титула, финала, панелей (brand_2 = brand — без градиента)
  brand_2: "#1D4ED8"
  on_brand: "#FFFFFF"
  accent: "#38BDF8"          # небесный — только декор на титуле
  on_accent: "#0B1B33"
  paper: "#FFFFFF"           # карточки на цветной панели
  on_paper: "#14213D"
  text: "#14213D"
  text_muted: "#556074"
  border: "#D7DDE6"
  on_status: "#FFFFFF"       # текст и иконки на шапках positive / negative
  positive: "#15803D"
  negative: "#B91C1C"
# Серии и сектора диаграмм по порядку: графика ≥ 3:1 к bg и surface, первые пять
# попарно различимы (CIEDE2000 ≥ 20), шестой — нейтральный для «прочее».
chart: ["#2563EB", "#C2410C", "#0F8A7E", "#A21CAF", "#B7791F", "#64748B"]
typescale: {hero: 96, display: 60, h1: 36, h2: 26, h3: 20, body: 18, small: 14, min: 12}
style:
  radius: 16                # скругление карточек, единиц сетки
  image_radius: 20          # скругление картинок
  gradient_angle: 0
  card: fill                # плоская светлая карточка без полосы
  card_stripe: none
  header: underline         # тёмный заголовок и тонкая акцентная линия под ним
  heading_color: primary
  badge: square             # номер — в скруглённом квадрате
  quote_plate: surface      # плашка цитаты statement.big_quote
  quote_text: text
  icon_plate: gradient      # brand = brand_2 → плоская синяя подложка
  accent_fill: primary
  full_color: cover         # целиком цветные — только титул и финал; пауза — синяя панель
# Декоративные фигуры темы: нативные фигуры PPTX (custGeom), цвет — токены темы.
# Только крупные плоские круги на цветных слайдах; на содержательных декора нет — больше воздуха.
decor:
  cover:
    - {shape: circle, center: [w-220, h/2+40], radius: 460, fill: on_brand, alpha: 0.07}
    - {shape: circle, center: [w-110, 150], radius: 110, fill: accent}
    - {shape: circle, center: [130, h-120], radius: 44, fill: on_brand, alpha: 0.18}
  band:
    - {shape: circle, center: [w-200, h/2+60], radius: 300, fill: on_brand, alpha: 0.08}
    - {shape: circle, center: [w-120, h/2-40], radius: 70, fill: accent}
  pause:
    - {shape: circle, center: [w-60, -20], radius: 260, fill: on_brand, alpha: 0.08}
  header: []
  content: []
# Пороги доли цвета в стресс-галерее (tests/gallery): плоская спокойная тема с одним акцентом
# и «воздухом» по решению владельца (D-070) — на содержательных слайдах цвет только в номерах,
# иконках и линиях; у линейной диаграммы — тонкие линии и плоская полоса вывода (≥ 8%).
gallery: {content_min: 0.5, chart_min: 8, median_min: 5}
contrast_pairs:
  - [text, bg]
  - [text, surface]
  - [text, surface_alt]
  - [text_muted, bg]
  - [text_muted, surface]
  - [primary, bg]
  - [primary, surface]
  - [on_primary, primary]
  - [on_brand, brand]
  - [on_brand, brand_2]
  - [on_accent, accent]
  - [on_paper, paper]
  - [positive, surface]
  - [negative, surface]
  - [on_status, positive]
  - [on_status, negative]
