# Заполнение «real» стресс-галереи: тексты из реальных колод (сессия 5, D-071; замечания владельца
# по колодам с прода и golden PR #83). Длины — настоящие, не подогнанные под вместимость: длинные
# заголовки, длинные слова, диапазоны, проценты, десятичная точка, склейки названий. Галерея
# прогоняет их тем же путём, что прод (типографика → fitter → resolve → финальная проверка PPTX),
# и ловит то, что владелец находил глазами: обрывы, «…», «Непротиворечивост / ь», «60– / 90»,
# наложение пунктов, пустую нижнюю половину.

