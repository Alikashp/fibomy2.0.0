# Строка «Количество слайдов» в user.txt ($slide_count_line). Код выбирает ключ
# по типу презентации, наличию материала и source_mode (ТЗ 3.3.3). Подстановка — $n.
# default — все типы, кроме доклада (текст прежний).
default: 'Количество слайдов: $n (строго).'
doklad_topic: 'Количество слайдов: ровно $n (строго) — вместе с титульным и финальным.'
doklad_strict: 'Количество слайдов: не больше $n и не меньше 5 — вместе с титульным и финальным. Если самостоятельных мыслей в материале меньше, сделай меньше слайдов: не повторяйся и не добавляй ничего сверх материала.'
doklad_extend: 'Количество слайдов: ровно $n (строго) — вместе с титульным и финальным. Если самостоятельных мыслей в материале не хватает, добавь слайды из общих знаний по теме: пояснения, контекст, определения — БЕЗ чисел, дат и ссылок на источники.'
