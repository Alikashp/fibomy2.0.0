topic: Учебный/ознакомительный доклад. Простое объяснение темы для аудитории, которая только знакомится с вопросом. Не выдумывай псевдо-исследовательские цифры без источника — лучше объяснение через логику и примеры, чем фейковая статистика.
topic_simplify_suffix: ' ОСОБЕННО ВАЖНО для этой аудитории: максимально простой язык, короткие предложения, конкретная бытовая аналогия на каждую идею, никакого термина без немедленного объяснения простыми словами тут же.'
material: 'Отчётный доклад по готовому материалу — НЕ учебный и НЕ питч-дек. Используй строго материал из блока МАТЕРИАЛ ниже как источник фактов, не выдумывай данные сверх него. Структура отчётная: что сделано → результаты → сложности → следующие шаги.'
