# Ориентиры объёма для доклада — подставляются в system.txt ({volume_instruction}).
# Ключ — ContentVolume. Для остальных типов — prompts/volume.yaml.
# Числа элементов — максимум, а не норма (ТЗ 4.8.3). Примеры «плохо / хорошо» —
# из области, которой нет в golden-корпусе (ТЗ 4.8.5): школа, склад.
short: |-
  краткий. Ориентиры по типам слайдов — это МАКСИМУМ, а не норма:
  элементов ставь столько, сколько самостоятельных мыслей или чисел есть, и не повторяй мысли с других слайдов.

  bullets — до 3 пунктов (минимум 2). Каждый пункт: одно короткое предложение с конкретным фактом,
    а не обрывок из 3-4 слов. Причину или следствие добавляй, только если они есть в материале (без материала — только общеизвестные).
    Плохо: "Новый стеллажный ряд — это ускорит отгрузку" (в материале этого следствия нет).
    Хорошо: "Новый стеллажный ряд на 400 паллет — один из двух проектов склада на весну".

  metrics — до 3 чисел. label: 2-4 слова — к чему относится число. trend: короткая фраза из материала или пусто.

  two_column — до 3 пунктов в каждой колонке, каждый одним коротким предложением.

  diagram — 3-5 узлов в схеме. Подписи узлов: 1-2 слова.
    body_text под схемой: одно предложение.

  quote — одно предложение. Отточенная формулировка, не пересказ слайда.

  timeline — столько этапов, сколько дат, до 4. title этапа: 2-3 слова. description: одно короткое предложение.

  image_full — body_text: 1-2 предложения.

  closing — body_text: 1-2 предложения, конкретное действие.

  Для ЛЮБОГО слайда: subtitle — одно короткое предложение, не повторяющее title.
