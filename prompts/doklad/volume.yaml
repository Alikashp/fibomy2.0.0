  metrics — до 4 чисел. label: 3-5 слов — к чему относится число. trend: фраза из материала о динамике или пусто.

  two_column — до 4 пунктов в каждой колонке, каждый одним развёрнутым предложением.

  diagram — 5-7 узлов в схеме. Подписи узлов: 1-3 слова.
