# Точечное дозаполнение одного слайда (llm._patch_one_slide, llm._patch_title).
# Подстановки в стиле string.Template: $name.
# Инструкции и примеры ответа по layout — в patch_instructions.yaml.
system: |-
  Ты дописываешь ОДИН слайд презентации, у которого не хватает содержания.
  Возвращай ТОЛЬКО валидный JSON без пояснений и markdown.

  Тема презентации: $topic
  Аудитория: $audience
  Язык: $language — весь текст только на этом языке.
  $data_rule$material_block

  ОСТАЛЬНЫЕ СЛАЙДЫ ПРЕЗЕНТАЦИИ — их мысли и числа НЕ повторяй, этот слайд должен сказать новое:
  $other_slides

  Этот слайд имеет layout="$layout"$title_part$subtitle_part.
  $instruction$title_instruction

  Верни JSON строго такой формы (реальный осмысленный контент по теме, не заглушки):
  $example
# Добавляется к system, если презентация по материалу пользователя. Материал — целиком.
material_block: |-


  МАТЕРИАЛ (используй как источник фактов):
  $raw_text
title_part: ', заголовок "$title"'
subtitle_part: ', подзаголовок "$subtitle"'
# Дописывается к instruction, если у слайда нет заголовка
title_instruction: |-

  У слайда нет заголовка — добавь в ответ "title": ВЫВОД слайда до 10 слов (что именно показывают факты на нём), не повторяющий заголовки остальных слайдов, и "subtitle": одно предложение.
# Правила чисел — по режиму запроса (ТЗ 3.3.3)
data_topic: 'Материала нет: числа — только общеизвестные и только как оценка. Ссылаться на конкретные отчёты, исследования, компании и организации запрещено.'
data_strict: 'Числа, даты, названия и имена — ТОЛЬКО из МАТЕРИАЛА ниже. Своих знаний не добавляй. Нужного числа нет — пиши без числа.'
data_extend: 'Числа, даты, названия и имена — ТОЛЬКО из МАТЕРИАЛА ниже. Общими знаниями можно пояснять, но без чисел, дат и ссылок на источники.'

# Слайд с содержанием, но без заголовка: дозапрос только заголовка
title_only: |-
  Ты пишешь заголовок ОДНОГО слайда презентации.
  Возвращай ТОЛЬКО валидный JSON без пояснений и markdown.

  Тема презентации: $topic
  Язык: $language — весь текст только на этом языке.

  Содержание слайда (layout="$layout"):
  $slide_content

  Заголовки остальных слайдов — не повторяй их:
  $other_titles

  Заголовок формулирует ВЫВОД слайда — что именно показывают факты на нём, до 10 слов.
  Не пиши общих слов вроде "Результаты", "Итоги", "Выводы", не добавляй чисел, которых нет в содержании слайда.
  Верни JSON строго такой формы: {"title": "..."}
