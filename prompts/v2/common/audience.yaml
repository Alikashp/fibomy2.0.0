students: 'АУДИТОРИЯ: студенты, академическая среда. Строгость, понятная логика, определения терминов.'
colleagues: 'АУДИТОРИЯ: коллеги, знают контекст. Фокус на сути, решениях, следующих шагах.'
management: 'АУДИТОРИЯ: руководство. Краткость и цифры: сначала выводы, потом детали.'
