# ИИ-картинки колоды (сессия 4, ТЗ 3.6, D-067): SiliconFlow, модель Z-Image-Turbo.
# Ключ — переменная SILICONFLOW_API_KEY (Railway: воркер). Без ключа колоды собираются без картинок.
model: Tongyi-MAI/Z-Image-Turbo     # id модели SiliconFlow (переопределяет SILICONFLOW_MODEL)
# 1024 × 1024 + 96 px (9,4%) запаса снизу: после среза полосы с маркировкой (marking) остаётся 1024 × 1040,
# дальше cover-crop под слот половины слайда (D-079)
image_size: 1024x1120
per_deck: 3                         # не больше картинок на колоду: титул + 2 слайда
timeout_seconds: 20                 # на одну картинку (запрос + скачивание); не успела — слайд без картинки
concurrency: 4                      # одновременных запросов на колоду
price_usd: 0.005                    # за картинку по прайсу SiliconFlow; в decks.cost_rub — × USD_RUB_RATE (D-078)
max_side: 1600                      # длинная сторона файла в PPTX, px
jpeg_quality: 82

# Маркировка «AI 生成», которую SiliconFlow ставит на картинки (D-079): срезаются полосы по краям, в пикселях
# исходной картинки — до cover-crop, поэтому кадрирование под слот полосу не возвращает. Зонд 15.10.2026
# (scripts/probe_siliconflow_watermark.py, 7 размеров 768×1024…1328×1328): надпись одна, в правом нижнем
# углу, размер не зависит от разрешения — текст 37–67 px от нижнего края и 39–142 px от правого (≈104×31 px);
# в остальных углах ничего нет. Срез снизу — 80 px: верх надписи (67 px) + 13 px запаса.
# Надпись сменит место или размер — поправить здесь (top / left / right — для других углов) и image_size.
marking:
  crop_px: {bottom: 80, top: 0, left: 0, right: 0}
