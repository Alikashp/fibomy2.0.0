# Описание kinds для плана. Код подставляет в $kinds только kinds, доступные в
# запросе (режим «по теме» — без chart_*; сессия 1 — statement, bullets, conclusion).
statement: 'statement — одна главная мысль: сильное утверждение, тезис, вывод, просьба к аудитории. Заголовок слайда и есть утверждение (до 20 слов).'
bullets: 'bullets — 3–6 равноправных пунктов без порядка и без сравнения: у каждого короткий заголовок и одно предложение.'
comparison: 'comparison — две стороны: два объекта по одним критериям, «за / против», «было / стало».'
process: 'process — 3–6 шагов по порядку, механизм, этапы без дат.'
metrics: 'metrics — 1–4 ключевых числа, которые не образуют ряд по времени и не доли целого.'
chart_series: 'chart_series — ряд чисел по времени или категориям из таблицы источника (диаграмма строится из таблицы).'
chart_share: 'chart_share — доли одного целого из таблицы источника, все доли на одной диаграмме.'
conclusion: 'conclusion — 2–5 выводов: что следует из фактов колоды, а не их пересказ. Обычно последний содержательный слайд.'
