# Правило числа слайдов ($slide_count). $n — число СОДЕРЖАТЕЛЬНЫХ слайдов
# (всего минус титул и финал: их ставит код). Перенос prompts/slide_count.yaml.
exact: |-
  ЧИСЛО СЛАЙДОВ: в плане ровно $n содержательных слайдов — не больше и не меньше.
strict: |-
  ЧИСЛО СЛАЙДОВ: не больше $n содержательных слайдов и не меньше 3. Если материала мало, слайдов меньше —
  это правильно: не растягивай один факт на несколько слайдов и ничего не добавляй от себя.
