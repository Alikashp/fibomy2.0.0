# Номера в фигурах темы на верхнем краю карточек, соединённые градиентной линией; название и
# пояснение — в карточке, высота по содержимому (05_LAYOUTS.md, 3.5): 3–5 шагов
id: process.horizontal_steps
kind: process
family: columns
version: 1
fallback: false
header: true
applies_when: {image: forbidden, items: {min: 3, max: 5}}
elements:
  - {name: title, type: text, box: [80, 80, 1760, 176], style: h1, min_style: h2, max_lines: 2,
     color: text, bind: title, anchor: middle}
  - {name: footnote, type: text, box: [80, 944, 1760, 40], style: small, min_style: min, max_lines: 1,
     color: text_muted, bind: footnote, optional: true}
items:
  bind: content.steps
  arrangements:
    3:
      grid: {area: [80, 328, 1760, 592], cols: 3, rows: 1, gap: 40, compact: center, pad: 36}
      elements:
        - {name: link, type: rect, box: [w/2+56, 44, w-72, 8], fill: "@accent_fill", radius: 4, skip_last: true}
        - {name: card, type: card, box: [0, 48, w, h-48]}
        - {name: badge, type: badge, box: [w/2-48, 0, 96, 96], style: h2, fill: primary, color: on_primary, bind: $index}
        - {name: label, type: text, box: [28, 128, w-56, 96], style: h3, min_style: body, max_lines: 2,
           color: primary, bind: label, align: center}
        - {name: text, type: text, box: [28, 236, w-56, 300], style: body, min_style: small, max_lines: 6,
           color: text_muted, bind: text, align: center}
    4:
      grid: {area: [80, 328, 1760, 592], cols: 4, rows: 1, gap: 32, compact: center, pad: 36}
      elements:
        - {name: link, type: rect, box: [w/2+56, 44, w-80, 8], fill: "@accent_fill", radius: 4, skip_last: true}
        - {name: card, type: card, box: [0, 48, w, h-48]}
        - {name: badge, type: badge, box: [w/2-48, 0, 96, 96], style: h2, fill: primary, color: on_primary, bind: $index}
        - {name: label, type: text, box: [28, 128, w-56, 96], style: h3, min_style: body, max_lines: 2,
           color: primary, bind: label, align: center}
        - {name: text, type: text, box: [28, 236, w-56, 300], style: body, min_style: small, max_lines: 6,
           color: text_muted, bind: text, align: center}
    5:
      grid: {area: [80, 328, 1760, 592], cols: 5, rows: 1, gap: 24, compact: center, pad: 36}
      elements:
        - {name: link, type: rect, box: [w/2+56, 44, w-88, 8], fill: "@accent_fill", radius: 4, skip_last: true}
        - {name: card, type: card, box: [0, 48, w, h-48]}
        - {name: badge, type: badge, box: [w/2-48, 0, 96, 96], style: h2, fill: primary, color: on_primary, bind: $index}
        - {name: label, type: text, box: [28, 128, w-56, 96], style: h3, min_style: body, max_lines: 2,
           color: primary, bind: label, align: center}
        - {name: text, type: text, box: [28, 236, w-56, 300], style: body, min_style: small, max_lines: 6,
           color: text_muted, bind: text, align: center}
