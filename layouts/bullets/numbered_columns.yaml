# Колонки с крупными номерами 01–04 цветом темы и цветной чертой (05_LAYOUTS.md, 3.3)
id: bullets.numbered_columns
kind: bullets
family: columns
version: 1
fallback: false
header: true
applies_when: {image: forbidden, items: {min: 3, max: 4}}
elements:
  - {name: title, type: text, box: [80, 80, 1760, 176], style: h1, min_style: h2, max_lines: 2,
     color: text, bind: title, anchor: middle}
  - {name: footnote, type: text, box: [80, 944, 1760, 40], style: small, min_style: min, max_lines: 1,
     color: text_muted, bind: footnote, optional: true}
items:
  bind: content.items
  arrangements:
    3:
      grid: {area: [80, 280, 1760, 640], cols: 3, rows: 1, gap: 40}
      elements: &column
        - {name: number, type: text, box: [0, 0, w, 144], style: display, min_style: h1, max_lines: 1,
           color: primary, bind: $index, format: "{:02d}", anchor: middle}
        - {name: rule, type: rect, box: [0, 152, w, 10], fill: "@accent_fill", radius: 5}
        - {name: heading, type: text, box: [0, 184, w, 96], style: h3, min_style: body, max_lines: 2,
           color: text, bind: heading}
        - {name: text, type: text, box: [0, 288, w, 352], style: body, min_style: small, max_lines: 8,
           color: text_muted, bind: text}
    4:
      grid: {area: [80, 280, 1760, 640], cols: 4, rows: 1, gap: 40}
      elements: *column
