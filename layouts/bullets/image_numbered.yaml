# Картинка слева на половину слайда, справа — пункты с номерами в фигурах темы (сессия 4: «текст + картинка»)
id: bullets.image_numbered
kind: bullets
family: image_split
version: 1
fallback: false
header: true
applies_when: {image: required, items: {min: 3, max: 4}}
elements:
  - {name: image, type: image, box: [64, 64, 800, 936], bind: image, radius: true}
  - {name: title, type: text, box: [940, 80, 900, 176], style: h1, min_style: h2, max_lines: 2,
     color: text, bind: title, anchor: middle}
  - {name: footnote, type: text, box: [940, 944, 900, 40], style: small, min_style: min, max_lines: 1,
     color: text_muted, bind: footnote, optional: true}
items:
  bind: content.items
  arrangements:
    3:
      grid: {area: [940, 296, 900, 624], cols: 1, rows: 3, gap: 24, compact: center, pad: 8}
      elements: &num
        - {name: badge, type: badge, box: [0, 0, 64, 64], style: h3, fill: primary, color: on_primary, bind: $index}
        - {name: heading, type: text, box: [88, 4, w-88, 48], style: h3, min_style: body, max_lines: 1,
           color: text, bind: heading}
        - {name: text, type: text, box: [88, 54, w-88, h-54], style: body, min_style: small, max_lines: 3,
           color: text_muted, bind: text}
    4:
      grid: {area: [940, 296, 900, 624], cols: 1, rows: 4, gap: 16, compact: center, pad: 8}
      elements:
        - {name: badge, type: badge, box: [0, 0, 64, 64], style: h3, fill: primary, color: on_primary, bind: $index}
        - {name: heading, type: text, box: [88, 4, w-88, 48], style: h3, min_style: body, max_lines: 1,
           color: text, bind: heading}
        - {name: text, type: text, box: [88, 54, w-88, h-54], style: body, min_style: small, max_lines: 2,
           color: text_muted, bind: text}
