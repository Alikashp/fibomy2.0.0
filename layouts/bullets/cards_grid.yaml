# Карточки: 3 в ряд, 2×2 или 3×2 (05_LAYOUTS.md, 3.3)
id: bullets.cards_grid
kind: bullets
family: cards
version: 1
fallback: true
applies_when: {image: forbidden, items: {min: 3, max: 6}}
elements:
  - {name: title, type: text, box: [80, 80, 1760, 176], style: h1, min_style: h2, max_lines: 2,
     color: text, bind: title, anchor: middle}
  - {name: footnote, type: text, box: [80, 944, 1760, 40], style: small, min_style: min, max_lines: 1,
     color: text_muted, bind: footnote, optional: true}
items:
  bind: content.items
  arrangements:
    3:
      grid: {area: [80, 280, 1760, 640], cols: 3, rows: 1, gap: 40}
      elements:
        - {name: card, type: rect, box: [0, 0, w, h], fill: surface, radius: true}
        - {name: icon, type: icon, box: [32, 32, 64, 64], color: primary, bind: icon}
        - {name: heading, type: text, box: [32, 120, w-64, 96], style: h3, min_style: body, max_lines: 2,
           color: text, bind: heading}
        - {name: text, type: text, box: [32, 232, w-64, h-264], style: body, min_style: small, max_lines: 8,
           color: text_muted, bind: text}
    4:
      grid: {area: [80, 280, 1760, 640], cols: 2, rows: 2, gap: 40}
      elements:
        - {name: card, type: rect, box: [0, 0, w, h], fill: surface, radius: true}
        - {name: icon, type: icon, box: [32, 32, 64, 64], color: primary, bind: icon}
        - {name: heading, type: text, box: [120, 32, w-152, 48], style: h3, min_style: body, max_lines: 1,
           color: text, bind: heading}
        - {name: text, type: text, box: [120, 88, w-152, 180], style: body, min_style: small, max_lines: 4,
           color: text_muted, bind: text}
    5:
      grid: {area: [80, 280, 1760, 640], cols: 3, rows: 2, gap: 40, center_last_row: true}
      elements: &small_card
        - {name: card, type: rect, box: [0, 0, w, h], fill: surface, radius: true}
        - {name: icon, type: icon, box: [w-80, 32, 48, 48], color: primary, bind: icon}
        - {name: heading, type: text, box: [32, 32, w-128, 96], style: h3, min_style: body, max_lines: 2,
           color: text, bind: heading}
        - {name: text, type: text, box: [32, 136, w-64, 140], style: body, min_style: small, max_lines: 3,
           color: text_muted, bind: text}
    6:
      grid: {area: [80, 280, 1760, 640], cols: 3, rows: 2, gap: 40}
      elements: *small_card
