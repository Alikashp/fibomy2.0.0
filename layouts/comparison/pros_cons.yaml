  - {name: left_point1, type: text, box: [120, 400, 760, 90], style: body, min_style: small, max_lines: 2, color: text, bind: content.left.points.0, format: "•  {}", optional: true}
  - {name: left_point2, type: text, box: [120, 512, 760, 90], style: body, min_style: small, max_lines: 2, color: text, bind: content.left.points.1, format: "•  {}", optional: true}
  - {name: left_point3, type: text, box: [120, 624, 760, 90], style: body, min_style: small, max_lines: 2, color: text, bind: content.left.points.2, format: "•  {}", optional: true}
  - {name: left_point4, type: text, box: [120, 736, 760, 90], style: body, min_style: small, max_lines: 2, color: text, bind: content.left.points.3, format: "•  {}", optional: true}
  - {name: right_point1, type: text, box: [1020, 400, 760, 90], style: body, min_style: small, max_lines: 2, color: text, bind: content.right.points.0, format: "•  {}", optional: true}
