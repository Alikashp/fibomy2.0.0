  - {name: right_panel, type: card, box: [980, 280, 860, 640]}
  - {name: left_cap, type: rect, box: [80, 280, 860, 96], fill: positive, radius: top}
  - {name: right_cap, type: rect, box: [980, 280, 860, 96], fill: negative, radius: top}
  - {name: left_icon, type: icon, box: [116, 300, 56, 56], color: on_status, bind: "const:check"}
  - {name: right_icon, type: icon, box: [1016, 300, 56, 56], color: on_status, bind: "const:x"}
  - {name: left_header, type: text, box: [196, 296, 704, 63], style: h2, min_style: h3, max_lines: 1,
     color: on_status, bind: content.left.header, anchor: middle}
  - {name: right_header, type: text, box: [1096, 296, 704, 63], style: h2, min_style: h3, max_lines: 1,
