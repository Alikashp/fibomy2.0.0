# «За / против»: шапки цветами positive / negative с иконками ✓ и ✕, под ними пункты (05_LAYOUTS.md, 3.4)
id: comparison.pros_cons
kind: comparison
family: panels
version: 1
fallback: false
header: true
applies_when: {image: forbidden, polarity: [pros_cons, before_after]}
compact:
  area: [80, 280, 1760, 640]
  align: center
  pad: 40
  panels: [left_panel, right_panel]
  stacks: [[left_point1, left_point2, left_point3, left_point4], [right_point1, right_point2, right_point3, right_point4]]
  gap: 22
